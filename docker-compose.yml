services:
  db:
    image: postgis/postgis:16-3.4
    container_name: transit_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: transit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: transit_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/transit
      ROUTING_ENGINE: raptor
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    container_name: transit_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Optional heavy OpenTripPlanner service for developers with high-RAM machines
  otp:
    image: docker.io/opentripplanner/opentripplanner:2.5.0
    container_name: transit_otp
    profiles: ["otp"]
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xmx6G"
    volumes:
      - ./data/otp:/var/otp
    ports:
      - "8080:8080"
    command: ["--load", "/var/otp"]

volumes:
  pgdata:
